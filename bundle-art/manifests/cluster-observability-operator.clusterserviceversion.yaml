apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "monitoring.rhobs/v1alpha1",
          "kind": "MonitoringStack",
          "metadata": {
            "labels": {
              "mso": "example"
            },
            "name": "sample-monitoring-stack"
          },
          "spec": {
            "logLevel": "debug",
            "resourceSelector": {
              "matchLabels": {
                "app": "demo"
              }
            },
            "retention": "1d"
          }
        },
        {
          "apiVersion": "monitoring.rhobs/v1alpha1",
          "kind": "ThanosQuerier",
          "metadata": {
            "name": "example-thanos"
          },
          "spec": {
            "selector": {
              "matchLabels": {
                "mso": "example"
              }
            }
          }
        }
      ]
    capabilities: Basic Install
    categories: Monitoring, Observability
    certified: 'false'
    console.openshift.io/operator-monitoring-default: 'true'
    containerImage: observability-operator:1.5.2
    createdAt: '2026-08-18T07:59:48Z'
    description: A Go based Kubernetes operator to setup and manage highly available Monitoring Stack using Prometheus, Alertmanager and Thanos Querier.
    operatorframework.io/cluster-monitoring: 'true'
    operatorframework.io/suggested-namespace: openshift-cluster-observability-operator
    operators.operatorframework.io/builder: operator-sdk-v1.41.1
    operators.operatorframework.io/internal-objects: |-
      [
        "prometheuses.monitoring.rhobs",
        "alertmanagers.monitoring.rhobs",
        "thanosrulers.monitoring.rhobs",
        "prometheusagents.monitoring.rhobs",
        "perses.perses.dev"
      ]
    operators.operatorframework.io/project_layout: unknown
    repository: https://github.com/rhobs/observability-operator
    features.operators.openshift.io/disconnected: 'true'
    features.operators.openshift.io/fips-compliant: 'false'
    features.operators.openshift.io/proxy-aware: 'false'
    features.operators.openshift.io/tls-profiles: 'false'
    features.operators.openshift.io/token-auth-aws: 'false'
    features.operators.openshift.io/token-auth-azure: 'false'
    features.operators.openshift.io/token-auth-gcp: 'false'
    features.operators.openshift.io/cnf: 'false'
    features.operators.openshift.io/cni: 'false'
    features.operators.openshift.io/csi: 'false'
    support: Cluster Observability (https://issues.redhat.com/projects/COO/)
    operators.openshift.io/valid-subscription: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
    olm.skipRange: '>=0.1.0 <1.5.2'
