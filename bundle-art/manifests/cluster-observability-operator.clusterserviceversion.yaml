      deployments:
      - label:
          app.kubernetes.io/component: controller
          app.kubernetes.io/name: prometheus-operator
          app.kubernetes.io/part-of: observability-operator
          app.kubernetes.io/version: 0.93.1-rhobs1
        name: obo-prometheus-operator
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/name: prometheus-operator
              app.kubernetes.io/part-of: observability-operator
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: prometheus-operator
                target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
              labels:
                app.kubernetes.io/component: controller
                app.kubernetes.io/name: prometheus-operator
                app.kubernetes.io/part-of: observability-operator
                app.kubernetes.io/version: 0.93.1-rhobs1
            spec:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/infra
                        operator: Exists
                    weight: 1
              automountServiceAccountToken: true
              containers:
              - args:
                - --prometheus-config-reloader=$(RELATED_IMAGE_PROMETHEUS_CONFIG_RELOADER)
                - --prometheus-instance-selector=app.kubernetes.io/managed-by=observability-operator
                - --alertmanager-instance-selector=app.kubernetes.io/managed-by=observability-operator
                - --thanos-ruler-instance-selector=app.kubernetes.io/managed-by=observability-operator
                - --watch-referenced-objects-in-all-namespaces=true
                - --disable-unmanaged-prometheus-configuration=true
                env:
                - name: GOGC
                  value: '30'
                - name: RELATED_IMAGE_PROMETHEUS_CONFIG_RELOADER
                  value: quay.io/rhobs/obo-prometheus-config-reloader:v0.93.1-rhobs1
                image: quay.io/rhobs/obo-prometheus-operator:v0.93.1-rhobs1
                name: prometheus-operator
                ports:
                - containerPort: 8080
                  name: http
                resources:
                  limits:
                    cpu: 100m
                    memory: 500Mi
                  requests:
                    cpu: 5m
                    memory: 150Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                terminationMessagePolicy: FallbackToLogsOnError
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
              serviceAccountName: obo-prometheus-operator
              tolerations:
              - effect: NoSchedule
                key: node-role.kubernetes.io/infra
                operator: Exists
      - label:
          app.kubernetes.io/name: prometheus-operator-admission-webhook
          app.kubernetes.io/part-of: observability-operator
          app.kubernetes.io/version: 0.93.1-rhobs1
        name: obo-prometheus-operator-admission-webhook
        spec:
          replicas: 2
          selector:
            matchLabels:
              app.kubernetes.io/name: prometheus-operator-admission-webhook
              app.kubernetes.io/part-of: observability-operator
          strategy:
            rollingUpdate:
              maxUnavailable: 1
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: prometheus-operator-admission-webhook
              labels:
                app.kubernetes.io/name: prometheus-operator-admission-webhook
                app.kubernetes.io/part-of: observability-operator
                app.kubernetes.io/version: 0.93.1-rhobs1
            spec:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/infra
                        operator: Exists
