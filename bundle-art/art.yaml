---
# ART bundle metadata (generated by hack/render-art-bundle.py).
#
# All images are built by ART and mapped in bundle-art/image-references,
# so no `external-images` section is required. The `updates` block marks the
# version-bearing strings ART's rebase automation keeps in sync (search ==
# replace: identity anchors rewritten on the next version bump).
updates:
  - file: "manifests/cluster-observability-operator.clusterserviceversion.yaml" # relative to this file
    update_list:
      - search: "olm.skipRange: '>=0.1.0 <1.5.4'"
        replace: "olm.skipRange: '>=0.1.0 <1.5.4'"
      - search: "version: 1.5.4"
        replace: "version: 1.5.4"
      - search: "name: cluster-observability-operator.v1.5.4"
        replace: "name: cluster-observability-operator.v1.5.4"
      - search: "replaces: cluster-observability-operator.v1.5.3"
        replace: "replaces: cluster-observability-operator.v1.5.3"
