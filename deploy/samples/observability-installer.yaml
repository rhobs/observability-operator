apiVersion: observability.openshift.io/v1alpha1
kind: ObservabilityInstaller
metadata:
  name: sample-observability
  namespace: observability
spec:
  capabilities:
    tracing:
      enabled: true
      storage:
        objectStorage:
          s3:
            bucket: tempo
            endpoint: https://s3.example.com
            accessKeyID: tempo
            accessKeySecret:
              name: s3-credentials
              key: access_key_secret