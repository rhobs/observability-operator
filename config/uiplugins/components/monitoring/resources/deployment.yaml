apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/managed-by: observability-operator
    app.kubernetes.io/part-of: UIPlugin
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/instance: monitoring
      app.kubernetes.io/managed-by: observability-operator
      app.kubernetes.io/part-of: UIPlugin
  template:
    metadata:
      name: monitoring
      labels:
        app.kubernetes.io/instance: monitoring
        app.kubernetes.io/managed-by: observability-operator
        app.kubernetes.io/part-of: UIPlugin
    spec:
      serviceAccountName: monitoring
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitoring
          image: monitoring-console-plugin:latest
          args:
            - -port=9443
            - -cert=/var/serving-cert/tls.crt
            - -key=/var/serving-cert/tls.key
          ports:
            - containerPort: 9443
              name: web
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: serving-cert
              readOnly: true
              mountPath: /var/serving-cert
      volumes:
        - name: serving-cert
          secret:
            secretName: monitoring
            defaultMode: 420
