apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: distributed-tracing
    app.kubernetes.io/managed-by: observability-operator
    app.kubernetes.io/name: distributed-tracing
    app.kubernetes.io/part-of: UIPlugin
  name: distributed-tracing
  namespace: openshift-cluster-observability-operator
spec:
  progressDeadlineSeconds: 300
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: distributed-tracing
      app.kubernetes.io/managed-by: observability-operator
      app.kubernetes.io/part-of: UIPlugin
  template:
    metadata:
      annotations:
        observability.openshift.io/ui-plugin-config-hash: 345ab688
      labels:
        app.kubernetes.io/instance: distributed-tracing
        app.kubernetes.io/managed-by: observability-operator
        app.kubernetes.io/part-of: UIPlugin
      name: distributed-tracing
    spec:
      containers:
      - args:
        - -port=9443
        - -cert=/var/serving-cert/tls.crt
        - -key=/var/serving-cert/tls.key
        - -plugin-config-path=/etc/plugin/config/config.yaml
        image: quay.io/openshift-observability-ui/distributed-tracing-console-plugin:v1.1.0
        name: distributed-tracing
        ports:
        - containerPort: 9443
          name: web
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /var/serving-cert
          name: serving-cert
          readOnly: true
        - mountPath: /etc/plugin/config
          name: plugin-config
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: distributed-tracing-sa
      volumes:
      - name: serving-cert
        secret:
          defaultMode: 420
          secretName: distributed-tracing
      - configMap:
          name: distributed-tracing
        name: plugin-config
