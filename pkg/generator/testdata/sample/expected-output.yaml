apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  labels:
    app.kubernetes.io/managed-by: observability-operator
    app.kubernetes.io/name: sample-observability
    app.kubernetes.io/part-of: sample-observability
  name: sample-observability
  namespace: sample
spec:
  config:
    exporters:
      debug: {}
      otlphttp/tempo:
        auth:
          authenticator: bearertokenauth
        endpoint: https://tempo-sample-observability-gateway.sample.svc.cluster.local:8080/api/traces/v1/application
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
          insecure: false
          reload_interval: 5s
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    processors:
      batch: {}
      k8sattributes: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
    receivers:
      jaeger:
        protocols:
          grpc: {}
          thrift_binary: {}
          thrift_compact: {}
          thrift_http: {}
      otlp:
        protocols:
          grpc: {}
          http: {}
      zipkin: {}
    service:
      extensions:
      - bearertokenauth
      pipelines:
        traces:
          exporters:
          - debug
          - otlphttp/tempo
          processors:
          - memory_limiter
          - k8sattributes
          - batch
          receivers:
          - otlp
          - jaeger
          - zipkin
      telemetry:
        logs:
          development: true
          encoding: json
          level: INFO
        metrics:
          level: detailed
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
  mode: deployment
  upgradeStrategy: automatic
