    metadata:
      labels:
        app.kubernetes.io/instance: korrel8r
        app.kubernetes.io/managed-by: observability-operator
        app.kubernetes.io/part-of: UIPlugin
    spec:
      containers:
      - command:
        - korrel8r
        - web
        - --https=:9443
        - --cert=/secrets/tls.crt
        - --key=/secrets/tls.key
        - --config=/config/korrel8r.yaml
        image: quay.io/korrel8r/korrel8r:0.11.1
        name: korrel8r
        ports:
        - containerPort: 9443
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /secrets/
          name: serving-cert
          readOnly: true
        - mountPath: /config/
          name: korrel8r-config
          readOnly: true
      serviceAccountName: troubleshooting-panel-sa
      volumes:
      - name: serving-cert
        secret:
          defaultMode: 420
          secretName: korrel8r
      - configMap:
          name: korrel8r
        name: korrel8r-config
